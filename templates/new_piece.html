{% extends 'base.html' %}
{% block title %}新增作品{% endblock %}

{% block head %}
<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .form-container h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #2c3e50;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #2c3e50;
        font-weight: 500;
    }
    .form-group input[type="text"],
    .form-group input[type="file"],
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ced4da;
        border-radius: 4px;
        font-size: 0.95rem;
        font-family: inherit;
    }
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
    }
    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }
    .form-actions button,
    .form-actions a {
        flex: 1;
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        font-size: 1rem;
        transition: all 0.3s;
    }
    .btn-submit {
        background-color: #27ae60;
        color: white;
    }
    .btn-submit:hover {
        background-color: #229954;
    }
    .btn-cancel {
        background-color: #95a5a6;
        color: white;
    }
    .btn-cancel:hover {
        background-color: #7f8c8d;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>新增作品</h2>
    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file">作品图片上传</label>
            <input type="file" name="file" id="file">
        </div>
        <div class="form-group">
            <label for="piece_name">作品名称:</label>
            <input type="text" id="piece_name" name="piece_name" required>
        </div>
        <div class="form-group">
            <label for="piece_type">作品类型:</label>
            <select id="piece_type" name="piece_type" required>
                <option value="漫画">漫画</option>
                <option value="动漫">动漫</option>
                <option value="小说">小说</option>
            </select>
        </div>
        <div class="form-group">
            <label for="piece_author">作者:</label>
            <input type="text" id="piece_author" name="piece_author" required>
        </div>
        <div class="form-group">
            <label for="piece_os">是否是原作:</label>
            <select id="piece_os" name="piece_os" required>
                <option value="True">是</option>
                <option value="False">否</option>
            </select>
        </div>
        <div class="form-group">
            <label for="piece_profile">作品简介:</label>
            <textarea id="piece_profile" name="piece_profile" maxlength="400" required placeholder="输入作品简介，不超过400字"></textarea>
        </div>
        <div class="form-group">
            <label for="piece_link">作品链接:</label>
            <textarea id="piece_link" name="piece_link" maxlength="255" required placeholder="输入链接，不超过255字"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">创建作品</button>
            <a href="{{ url_for('pieces') }}" class="btn-cancel">取消</a>
        </div>
    </form>
</div>
{% endblock %}
