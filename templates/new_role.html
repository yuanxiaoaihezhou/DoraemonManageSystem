{% extends 'base.html' %}
{% block title %}新增角色{% endblock %}

{% block head %}
<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .form-container h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #2c3e50;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #2c3e50;
        font-weight: 500;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="file"],
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ced4da;
        border-radius: 4px;
        font-size: 0.95rem;
        font-family: inherit;
    }
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
    }
    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }
    .form-actions button,
    .form-actions a {
        flex: 1;
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        font-size: 1rem;
        transition: all 0.3s;
    }
    .btn-submit {
        background-color: #27ae60;
        color: white;
    }
    .btn-submit:hover {
        background-color: #229954;
    }
    .btn-cancel {
        background-color: #95a5a6;
        color: white;
    }
    .btn-cancel:hover {
        background-color: #7f8c8d;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>新增角色</h2>
    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file">角色图片上传</label>
            <input type="file" name="file" id="file">
        </div>
        <div class="form-group">
            <label for="role_name">角色名:</label>
            <input type="text" id="role_name" name="role_name" required>
        </div>
        <div class="form-group">
            <label for="role_gender">性别:</label>
            <select id="role_gender" name="role_gender" required>
                <option value="male">男</option>
                <option value="female">女</option>
                <option value="other">其他</option>
            </select>
        </div>
        <div class="form-group">
            <label for="role_age">年龄:</label>
            <input type="number" id="role_age" name="role_age" required>
        </div>
        <div class="form-group">
            <label for="role_profile">角色简介:</label>
            <textarea id="role_profile" name="role_profile" maxlength="400" required placeholder="输入角色简介，不超过400字"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">创建角色</button>
            <a href="{{ url_for('roles') }}" class="btn-cancel">取消</a>
        </div>
    </form>
</div>
{% endblock %}
